<title>Menphis RPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1e1604;--bg2:#150f02;--card:#2b1f06;--tx:#f0dfb0;--mut:#b9a56e;--ac:#f5d98a;--ac2:#c9a227;--bd:#7a5f22}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3e8c8;--bg2:#e6d5a4;--card:#fbf3dc;--tx:#2b1f06;--mut:#6d5a28;--ac:#7a4e00;--ac2:#a67c00;--bd:#b9a060}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.6 Georgia,"Times New Roman",serif;background:radial-gradient(circle at 15% 0,#4a3510 0,transparent 45%),radial-gradient(circle at 90% 100%,#3a2508 0,transparent 40%),var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg2),var(--bg));border-bottom:2px solid var(--ac2);padding:8px 12px;box-shadow:0 4px 18px #0008}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{margin:0;font:700 20px "Cinzel Decorative","Cinzel",Georgia,serif;color:var(--ac);letter-spacing:3px;text-shadow:0 0 12px #f5d98a66}
#me{font-size:13px;color:var(--mut);text-align:right}#me b{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
nav button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 11px;font:600 13px "Cinzel",Georgia,serif;cursor:pointer}
nav button.on{background:linear-gradient(var(--ac),var(--ac2));color:#1b1202;border-color:var(--ac)}
main{max-width:960px;margin:0 auto;padding:16px 14px 110px}
h2{font:700 26px "Cinzel Decorative","Cinzel",Georgia,serif;color:var(--ac);margin:6px 0 4px;text-align:center}
.div{height:16px;margin:0 auto 14px;max-width:340px;background:linear-gradient(90deg,transparent,var(--ac2),transparent) center/100% 1px no-repeat;text-align:center;line-height:16px;color:var(--ac2)}
h3{font:700 17px "Cinzel",Georgia,serif;color:var(--ac);margin:0 0 6px}
.card{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--bd);border-radius:10px;padding:14px;margin:0 0 14px;box-shadow:0 3px 14px #0006,inset 0 0 0 3px #0003}
.card::before,.card::after{content:"❖";position:absolute;font-size:10px;color:var(--ac2);opacity:.8}.card::before{top:3px;left:6px}.card::after{bottom:3px;right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mut{color:var(--mut);font-size:14px}.q{font-style:italic;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit}
input[readonly]{opacity:.75}
.btn{background:linear-gradient(var(--ac),var(--ac2));color:#1b1202;border:0;border-radius:6px;padding:8px 14px;font:700 14px "Cinzel",Georgia,serif;cursor:pointer;margin:8px 6px 0 0;box-shadow:0 2px 6px #0007}
.btn.s{padding:3px 9px;font-size:12px;margin:2px}.btn:disabled{opacity:.4}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px;color:var(--mut)}
.big{font:700 30px "Cinzel",Georgia,serif;color:var(--ac)}.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--bd);padding:5px 8px;text-align:left}
details{margin:0 0 8px}summary{cursor:pointer;color:var(--ac);font-weight:bold}
#log div{border-bottom:1px solid var(--bd);padding:3px 0;font-size:14px}
.bar{height:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.hero{border-radius:12px;overflow:hidden;border:2px solid var(--ac2);margin-bottom:14px;box-shadow:0 6px 24px #000a}.hero svg{display:block;width:100%;height:auto}
.post{border-bottom:1px solid var(--bd);padding:8px 0}.post b{color:var(--ac)}
.mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:var(--bd);border:2px solid var(--ac2);max-width:640px;margin:0 auto 12px}
.mgrid div{aspect-ratio:1;background:var(--bg2);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mgrid div.fog{background:#000;opacity:.9}.tk{width:86%;height:86%;border-radius:50%;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#111}.tk.sel{outline:3px solid var(--ac)}
.chat{max-height:340px;overflow-y:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px}.mem button{aspect-ratio:1;font-size:28px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx);cursor:pointer}
#fab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:3px solid var(--ac);background:radial-gradient(var(--card),var(--bg2));z-index:25;cursor:pointer;box-shadow:0 0 18px #f5d98a88;padding:4px}
#rad{position:fixed;inset:0;background:#000d;z-index:40;display:none}#rad.on{display:block}
.ri{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:2px solid var(--ac2);background:radial-gradient(var(--card),var(--bg2));color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;padding:0;box-shadow:0 0 10px #f5d98a55}.ri small{font-size:8px;margin-top:2px;color:var(--ac)}
#radc{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;border:3px solid var(--ac);background:var(--bg2);cursor:pointer;padding:6px}
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#3a2a0a,#0b0700);padding:16px}
#gate .card{max-width:420px;width:100%;text-align:center}#gate svg.e{width:110px;height:110px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:#1b1202;padding:8px 14px;border-radius:8px;z-index:70;display:none;font-weight:bold}
</style>

function addArm(){const n=$('#an').value.trim();if(n)add('armory',{n,r:$('#ak').value,d:$('#ad').value})}
const RK=['Etório','Drigênio','Cáurido','Berípeta','Arysalis','Sagistral','SSídeo'];
const MD=[['Pacífico',i=>4+2*i,i=>20+5*i,i=>500+50*i],['Fácil',i=>20+4*i,i=>70+5*i,i=>2500+250*i],['Média',i=>40+5*i,i=>120+5*i,i=>[6000,6800,7200,7600,8000,8400,8800][i]],['Arriscada',i=>50+5*i,i=>130+5*i,i=>8000+500*i],['Difícil',i=>70+5*i,i=>[200,250,300,350,400,450,500][i],i=>20000+5000*i],['Extrema',i=>100+5*i,i=>550+50*i,i=>55000+5000*i],['Impossível',i=>i<6?150+10*i:250,i=>900+50*i,i=>90000+5000*i]];
function drawMG(){const b=$('#mb');if(!b)return;const m=MD[+$('#md').value];b.innerHTML=RK.map((r,i)=>`<div class="card"><h3>${m[0]} · ${r}</h3><p class="mut">${m[1](i)}x em atributos</p><span class="tag">${m[2](i)} xp</span><span class="tag">${m[3](i).toLocaleString('pt-BR')} tarjas</span><br><button class="btn s" onclick="acceptQ('${m[0]} ${r}',${m[2](i)},${m[3](i)})">Aceitar</button></div>`).join('')}
function acceptQ(label,xp,tj){const id=$('#mc').value;if(!id){toast('Crie um personagem.');return}add('mq',{owner:ME.id,by:ME.name,cid:id,label:$('#mg').value+': '+label,xp,tj,status:'ativa'});toast('Missão aceita.')}
async function approveQ(id){const q=LOC.get('mq').find(x=>x.id===id)||(await DB.collection('mq').doc(id).get()).data();const c=CH(q.cid);if(c)await grant(c,q.xp,q.tj);upd('mq',id,{status:'concluída'})}
let MEM=[],MF=[];
function memStart(){const e=['🔥','💧','🌪️','⛰️','⚡','🌙','🗡️','🐉'];MEM=[...e,...e].sort(()=>Math.random()-.5);MF=[];window.MD2=[];memDraw()}
function memDraw(){const m=$('#mm');if(!m)return;m.innerHTML=MEM.map((e,i)=>`<button onclick="memClick(${i})">${MD2.includes(i)||MF.includes(i)?e:'?'}</button>`).join('')}
function memClick(i){if(MF.length>=2||MF.includes(i)||MD2.includes(i))return;MF.push(i);memDraw();if(MF.length===2){const[a,b]=MF;setTimeout(()=>{if(MEM[a]===MEM[b])MD2.push(a,b);MF=[];memDraw();if(MD2.length===16&&$('#mmsg'))$('#mmsg').textContent='Vitória! 🏆'},600)}}
let RT=0,RH;function reflex(){const b=$('#rb');if(b.dataset.s==='go'){const ms=Date.now()-RT;b.dataset.s='';b.textContent='Começar';const best=Math.min(ms,store.get('bestR',9e9));store.set('bestR',best);$('#rmsg').textContent=`${ms} ms · melhor ${best} ms`;return}if(b.dataset.s==='wait'){clearTimeout(RH);b.dataset.s='';b.textContent='Cedo demais! Tente de novo';return}b.dataset.s='wait';b.textContent='Aguarde…';RH=setTimeout(()=>{b.dataset.s='go';b.textContent='AGORA!';RT=Date.now()},1000+Math.random()*2500)}
function duel(e){const L=['Água','Fogo','Vento','Terra'],w={Água:'Fogo',Fogo:'Vento',Vento:'Terra',Terra:'Água'},o=pick(L);$('#dmsg').textContent=`Você: ${e} · Oponente: ${o} → ${e===o?'Empate':w[e]===o?'Vitória!':'Derrota'}`}
function boot(){initRuntime();const g=store.get('guest',null);if(store.get('mode',0)==='guest'&&g){ME={id:'g_'+g.id,name:g.name,role:'Player',guest:1};enter()}}
boot();

</script></body></html>
